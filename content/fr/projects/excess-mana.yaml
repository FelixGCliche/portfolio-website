built:
  - "Excess Mana est un jeu de tower defense dans lequel un mage doit protéger son temple des assauts de slimes de différents éléments attirés par l'afflux de mana."
  - "Le but est d'explorer et recueillir des ressources durant le jour afin de pouvoir améliorer ses défenses contre les slimes la nuit tombée."
  - "Ce jeu a été développé durant un gamejam de 48h organisé par l'Université du Québec à Chicoutimi (UQAC). J'ai été invité par 3 de mes amis qui étudiaient là-bas à ce moment."
  - "J'ai travaillé sur la collecte de ressources, l'inventaire du joueur et l'interface utilisateur. J'ai aussi créé les visuels pour le personnage principal."
