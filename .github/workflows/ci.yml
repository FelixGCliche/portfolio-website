name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - parallel:
          - name: Typecheck
            run: bun run check:type
          - name: Format check
            run: bun run check:format
          - name: Lint
            run: bun run check:lint
